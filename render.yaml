version: "1"

databases:
  - name: youwee-db
    databaseName: youwee
    user: youwee
    plan: free
    region: frankfurt

services:
  - type: web
    name: youwee-api
    runtime: docker
    dockerfilePath: ./Dockerfile.web
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: youwee-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: youwee-kv
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: PUBLIC_APP_URL
        value: https://youwee-web.onrender.com
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: STORAGE_REGION
        value: auto
    autoDeploy: true

  - type: worker
    name: youwee-worker
    runtime: docker
    dockerfilePath: ./Dockerfile.worker
    dockerContext: .
    plan: starter
    region: frankfurt
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: youwee-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: youwee-kv
          property: connectionString
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: STORAGE_REGION
        value: auto
    autoDeploy: true

keyvalue:
  - name: youwee-kv
    plan: free
    region: frankfurt