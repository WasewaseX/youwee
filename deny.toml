# cargo-deny configuration (advisory gate).
[licenses]
unlicensed = "deny"
copyleft = "allow"
allow = ["MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "MPL-2.0", "CC0-1.0", "OpenSSL", "CDLA-Permissive-2.0", "W3C-20150513", "Unicode-TOU"]

[advisories]
yanked = "warn"

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
